openapi: 3.0.3
info:
  title: Armith KYC API
  version: 1.1.0
  description: |
    Armith API-only KYC service.

    **Authentication:**
    - KYC routes accept `x-api-key: ak_live_…`, `Authorization: Bearer ak_live_…`, Clerk JWT, or `X-Verification-Session`.
    - Admin, config, and webhook management routes require Clerk dashboard JWT.

    **Webhooks:** See product docs — multi-webhook HMAC signing uses SHA-256(rawKey) as HMAC key.

    Full narrative documentation: https://armith-docs-standalone.onrender.com
servers:
  - url: https://armith-backend-live.onrender.com
    description: Sandbox / shared backend
  - url: https://api.armith.com
    description: Production (when provisioned)
tags:
  - name: Health
  - name: Auth
  - name: KYC
  - name: Admin
  - name: Webhooks
  - name: Config
  - name: Integrator
  - name: KYB
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk dashboard session JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Server-to-server API key (ak_live_…)
    captureSession:
      type: apiKey
      in: header
      name: X-Verification-Session
      description: Short-lived capture session token
  schemas:
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        numericCode:
          type: integer
        message:
          type: string
        field:
          type: string
    UploadUrlRequest:
      type: object
      properties:
        fileType:
          type: string
          example: image/jpeg
        userId:
          type: string
          nullable: true
        documentType:
          type: string
          enum: [id-front, id-back, selfie]
      required: [fileType]
    UploadUrlResponse:
      type: object
      properties:
        success:
          type: boolean
        uploadUrl:
          type: string
        downloadUrl:
          type: string
        expiresIn:
          type: integer
    IdCheckRequest:
      type: object
      properties:
        countryCode:
          type: string
          example: TR
        frontImageUrl:
          type: string
        backImageUrl:
          type: string
          nullable: true
        integrationExternalRef:
          type: string
          maxLength: 256
        integrationMetadata:
          type: object
          additionalProperties:
            type: string
      required: [countryCode, frontImageUrl]
    SelfieCheckRequest:
      type: object
      properties:
        idPhotoUrl:
          type: string
        selfieUrls:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        profileId:
          type: string
        integrationExternalRef:
          type: string
        integrationMetadata:
          type: object
          additionalProperties:
            type: string
      required: [idPhotoUrl, selfieUrls]
    FlatThresholds:
      type: object
      description: Admin settings flat threshold keys
      properties:
        fullNameConfidence:
          type: number
        identityNumberConfidence:
          type: number
        matchConfidence:
          type: number
          description: Face match 0-100
        idMinCaptureSharpness:
          type: number
          description: Laplacian preflight blur gate 0-1
        selfieMinCaptureSharpness:
          type: number
        idMinImageQuality:
          type: number
        selfieMinImageQuality:
          type: number
        minDocumentVitalityConfidence:
          type: number
        spoofingRiskMax:
          type: number
    GenericErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: failed
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
    ApiKeySummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    CreateApiKeyResponse:
      type: object
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKeySummary'
        token:
          type: string
          description: Shown once at creation time
    WebhookCreateRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - verification.completed
              - verification.failed
              - verification.manual_review_queued
              - verification.manual_review_resolved
        dataFields:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        signingKey:
          type: object
          properties:
            source:
              type: string
              enum: [account_default, generate_new, bring_your_own]
            raw:
              type: string
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service healthy
  /auth/status:
    get:
      tags: [Auth]
      summary: Authentication status
      responses:
        '200':
          description: Auth status payload
  /auth/profile:
    get:
      tags: [Auth]
      summary: Get current dashboard user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile returned
        '401':
          description: Unauthorized
  /kyc/countries:
    get:
      tags: [KYC]
      summary: List supported countries
      responses:
        '200':
          description: Supported country list
  /kyc/llm-status:
    get:
      tags: [KYC]
      summary: LLM service status
      responses:
        '200':
          description: LLM status returned
  /kyc/upload-url:
    post:
      tags: [KYC]
      summary: Generate pre-signed upload URL
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Upload and download URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '401':
          description: Missing or invalid credentials
  /kyc/secure-download-url:
    post:
      tags: [KYC]
      summary: Generate secure download URL for tenant-owned storage key
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
              required: [fileName]
      responses:
        '200':
          description: Download URL created
  /kyc/id-check:
    post:
      tags: [KYC]
      summary: Run ID verification (preflight + LLM + server rules)
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Optional 24h deduplication key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdCheckRequest'
      responses:
        '200':
          description: ID verification result
        '400':
          description: Validation or preflight failure (e.g. BLURRY_IMAGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorResponse'
        '429':
          description: PLAN_LIMIT_REACHED
  /kyc/selfie-check:
    post:
      tags: [KYC]
      summary: Run selfie verification
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfieCheckRequest'
      responses:
        '200':
          description: Selfie verification result
        '400':
          description: Validation failure
  /kyc/videocall/session:
    post:
      tags: [KYC]
      summary: Mint a Video Ident LiveKit session
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordingConsent]
              properties:
                profileId:
                  type: string
                recordingConsent:
                  type: boolean
      responses:
        '200':
          description: LiveKit wsUrl + applicant JWT
        '409':
          description: VIDEOCALL_NOT_REQUIRED
  /kyc/videocall/heartbeat:
    post:
      tags: [KYC]
      summary: Applicant waiting-room heartbeat
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      responses:
        '200':
          description: Session status
  /kyc/videocall/frame:
    post:
      tags: [KYC]
      summary: Score a live-call still against the ID portrait
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      responses:
        '200':
          description: Running scores
  /kyc/videocall-check:
    post:
      tags: [KYC]
      summary: Finalize Video Ident (thresholds + hybrid decision)
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      responses:
        '200':
          description: Videocall checkpoint result
  /kyc/status/{profileId}:
    get:
      tags: [KYC]
      summary: Get consolidated profile verification status (uppercase status)
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile status payload
        '404':
          description: Profile not found
  /kyc/sessions/{id}:
    get:
      tags: [KYC]
      summary: Session status alias (same handler as /kyc/status/{profileId})
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - captureSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile status payload
  /admin/verifications:
    get:
      tags: [Admin]
      summary: List verifications (paginated)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [APPROVED, REJECTED, PENDING, UNDER_REVIEW, FAILED]
      responses:
        '200':
          description: Paginated verification list
  '/admin/verifications/{profileId}':
    delete:
      tags: [Admin]
      summary: Delete verification profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  '/admin/verifications/{profileId}/capture-session':
    post:
      tags: [Admin]
      summary: Mint capture session token for embedded flows
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token issued
  /admin/stats:
    get:
      tags: [Admin]
      summary: Dashboard verification statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stats payload
  /admin/settings:
    get:
      tags: [Admin]
      summary: Get tenant KYC settings (flat thresholds + integration)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings and defaults payload
    put:
      tags: [Admin]
      summary: Update verification rules, thresholds, legacy integration webhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verificationRules:
                  type: object
                thresholds:
                  $ref: '#/components/schemas/FlatThresholds'
                integration:
                  type: object
      responses:
        '200':
          description: Settings updated
  /admin/settings/reset:
    post:
      tags: [Admin]
      summary: Reset KYC settings to defaults
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings reset
  /admin/api-keys:
    get:
      tags: [Admin]
      summary: List API keys (Integrations → API Keys)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Key metadata list
    post:
      tags: [Admin]
      summary: Create API key (token shown once)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
  '/admin/api-keys/{id}':
    delete:
      tags: [Admin]
      summary: Revoke API key
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked
    patch:
      tags: [Admin]
      summary: Update per-key IP allowlist (plan-gated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
  /admin/account-api-ip-allowlist:
    put:
      tags: [Admin]
      summary: Set account-wide API IP allowlist (CIDR rules)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
  /admin/webhooks:
    get:
      tags: [Webhooks]
      summary: List outbound webhooks (max 10)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Webhook list
    post:
      tags: [Webhooks]
      summary: Create webhook (rawKey returned once if generated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Created
  '/admin/webhooks/{id}':
    patch:
      tags: [Webhooks]
      summary: Update webhook
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
    delete:
      tags: [Webhooks]
      summary: Delete webhook
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  '/admin/webhooks/{id}/rotate-key':
    post:
      tags: [Webhooks]
      summary: Rotate webhook signing key
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New rawKey returned once
  /admin/webhooks/signing-key/default:
    get:
      tags: [Webhooks]
      summary: Account default signing key status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Key hint and mintedAt
    post:
      tags: [Webhooks]
      summary: Mint account default signing key
      security:
        - bearerAuth: []
      responses:
        '200':
          description: rawKey shown once
  /admin/webhook-deliveries:
    get:
      tags: [Webhooks]
      summary: Webhook delivery log
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated deliveries
  '/admin/webhooks/replay/{profileId}':
    post:
      tags: [Webhooks]
      summary: Replay terminal webhook for profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Replay result
  /admin/manual-reviews:
    get:
      tags: [Admin]
      summary: Manual review queue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue page
  '/admin/manual-reviews/{profileId}/resolve':
    post:
      tags: [Admin]
      summary: Resolve manual review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resolved
  /config:
    get:
      tags: [Config]
      summary: Get nested KYC configuration document
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration payload
    patch:
      tags: [Config]
      summary: Partial update with version optimistic locking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
        '409':
          description: Version conflict
  /config/presets:
    get:
      tags: [Config]
      summary: List available presets (public)
      responses:
        '200':
          description: strict, balanced, lenient
  /config/preset:
    post:
      tags: [Config]
      summary: Apply preset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preset:
                  type: string
              required: [preset]
      responses:
        '200':
          description: Preset applied
  /kyc/eid-check:
    post:
      tags: [KYC]
      summary: eID NFC chip verification (caller must own the profile)
      security:
        - apiKeyAuth: []
        - captureSession: []
      responses:
        '200':
          description: Chip validation result
        '403':
          description: Profile access denied
  /kyc/profiles:
    post:
      tags: [Integrator]
      summary: Create integrator profile and mint hosted redirect URL
      security:
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
  /kyc/hosted-sessions:
    post:
      tags: [Integrator]
      summary: One-shot hosted web capture session
      security:
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
  /kyc/profiles/{profileId}/sessions:
    post:
      tags: [Integrator]
      summary: Mint an additional capture session for an existing profile
      security:
        - apiKeyAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session minted
  /kyc/sessions/complete:
    post:
      tags: [Integrator]
      summary: Exchange a one-time result code
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Profile status
  /kyc/sessions/result-code:
    post:
      tags: [Integrator]
      summary: Mint a result code (write session; profile must be terminal)
      security:
        - captureSession: []
      responses:
        '200':
          description: Code issued
        '409':
          description: Verification not terminal
  /kyb/profiles:
    get:
      tags: [KYB]
      summary: List KYB entity records (manual CRUD)
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: List
    post:
      tags: [KYB]
      summary: Create a KYB entity record
      security:
        - apiKeyAuth: []
      responses:
        '201':
          description: Created
  /admin/workflows:
    get:
      tags: [Admin]
      summary: List verification workflow overlays
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workflows
    put:
      tags: [Admin]
      summary: Upsert a workflow overlay
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved
  /admin/data-subject/{profileId}:
    get:
      tags: [Admin]
      summary: Export data-subject payload
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export
    delete:
      tags: [Admin]
      summary: Delete data-subject records
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '409':
          description: Legal hold
